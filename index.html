<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☠️Don't Poison Yourself☠️ | Allergen Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header & Dark Mode Toggle -->
    <header class="dashboard-header">
        <div class="header-content">
            <h1>☠️Don't Poison Yourself☠️</h1>
            <button type="button" id="theme-toggle">Toggle Dark Mode</button>
        </div>
    </header>

    <!-- Main 3-Widget Dashboard Container -->
    <main class="dashboard-grid">

        <!-- Widget 1: My Allergies -->
        <section class="widget">
            <h2>My Allergies</h2>
            <form id="allergen-form">
                <label for="allergen-input">Add an allergen:</label>
                <div class="input-row">
                    <input type="text" id="allergen-input" placeholder="e.g. Fragrance" required>
                    <button type="submit">Add</button>
                </div>
            </form>
            <div id="allergen-stats"></div>
            <ul id="allergen-list"></ul>
        </section>

       <!-- Widget 2: Check Product -->
<section class="widget">
    <h2>Check Product</h2>
    <form id="checker-form">
        <label for="product-name">Product name <span class="required-star">*</span></label>
        <input type="text" id="product-name" placeholder="e.g. Daily Facial Cleanser" required>

        <div class="form-row">
            <div class="form-group">
                <label for="product-brand">Brand / Maker</label>
                <input type="text" id="product-brand" placeholder="e.g. CeraVe">
            </div>
            <div class="form-group">
                <label for="product-category">Type</label>
                <select id="product-category">
                    <option value="">Select type...</option>
                    <option value="Skincare">Skincare</option>
                    <option value="Haircare">Haircare</option>
                    <option value="Body & Soap">Body & Soap</option>
                    <option value="Makeup">Makeup</option>
                    <option value="Household">Household</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <label for="product-notes">Notes</label>
        <input type="text" id="product-notes" placeholder="e.g. Bought on sale, patch test passed">

        <label for="ingredients-input">Paste ingredient list <span class="required-star">*</span></label>
        <textarea id="ingredients-input" rows="4" placeholder="Water, Glycerin, Fragrance..." required></textarea>

        <button type="submit">Check</button>
    </form>
    <div id="checker-result"></div>
</section>


        <!-- Widget 3: Tested Products -->
        <section class="widget">
            <h2>Tested Products</h2>

            <!-- Search & Filter Controls -->
            <div class="history-controls">
                <input type="text" id="history-search" placeholder="Search tested products...">
                <div class="filter-btn-group">
                    <button type="button" class="filter-btn active" data-filter="all">All</button>
                    <button type="button" class="filter-btn filter-safe-btn" data-filter="safe">Safe</button>
                    <button type="button" class="filter-btn filter-avoid-btn" data-filter="avoid">Avoid</button>
                </div>
            </div>

            <!-- Stats Row -->
            <div id="history-stats"></div>

            <!-- Tested Products List -->
            <ul id="history-list"></ul>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
